{% extends "base.html" %}
{% load i18n %}

{% block content %}
<section class="mx-auto max-w-md rounded-ob-xl border border-ob-peach100 bg-white p-8 shadow-md">
    <h1 class="font-display text-2xl font-bold text-ob-ink">{% trans "Reset your password" %}</h1>
    <p class="mt-2 text-sm text-ob-muted">{% trans "Enter your operator email to receive a reset link." %}</p>

    <form method="post" class="mt-6 space-y-4">
        {% csrf_token %}
        <div>
            <label for="{{ form.email.id_for_label }}" class="mb-1 block text-sm font-medium text-stone-700">{% trans "Email" %}</label>
            {{ form.email }}
        </div>
        <button type="submit" class="w-full rounded-ob-lg bg-ob-peach800 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-ob-peach600">
            {% trans "Send reset link" %}
        </button>
    </form>
</section>
{% endblock %}
