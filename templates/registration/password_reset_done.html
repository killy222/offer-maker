{% extends "base.html" %}
{% load i18n %}

{% block content %}
<section class="mx-auto max-w-md rounded-ob-xl border border-ob-peach100 bg-white p-8 shadow-md">
    <h1 class="font-display text-2xl font-bold text-ob-ink">{% trans "Check your email" %}</h1>
    <p class="mt-2 text-sm text-ob-muted">
        {% trans "If an account exists for that email, we sent instructions to reset your password." %}
    </p>
    <a href="{% url 'login' %}" class="mt-4 inline-block text-sm font-medium text-ob-peach800 underline decoration-ob-peach200 hover:text-ob-peach600">{% trans "Back to login" %}</a>
</section>
{% endblock %}
