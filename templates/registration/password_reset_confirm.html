{% extends "base.html" %}
{% load i18n %}

{% block content %}
<section class="mx-auto max-w-md rounded-ob-xl border border-ob-peach100 bg-white p-8 shadow-md">
    <h1 class="font-display text-2xl font-bold text-ob-ink">{% trans "Set a new password" %}</h1>
    {% if validlink %}
    <form method="post" class="mt-6 space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="w-full rounded-ob-lg bg-ob-peach800 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-ob-peach600">
            {% trans "Save new password" %}
        </button>
    </form>
    {% else %}
    <p class="mt-3 text-sm text-red-800">
        {% trans "This reset link is invalid or has already been used." %}
    </p>
    {% endif %}
</section>
{% endblock %}
