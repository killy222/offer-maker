[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "offer-creator"
version = "0.1.0"
description = "Offer builder platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django==5.2.10",
    "django-storages>=1.14",
    "reportlab>=4.2.0",
    "psycopg[binary]==3.2.9",
    "pytest==8.4.2",
    "pytest-django==4.11.1",
    "pre-commit>=4.5.0",
    "black>=26.1.0",
    "ruff>=0.15.0",
    "codespell>=2.4.1",
]

[tool.black]
line-length = 100
target-version = ["py313"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | migrations
)/
'''

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "migrations",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C", "B", "UP"]
ignore = ["E501", "B008", "C901"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "apps*"]

[dependency-groups]
dev = [
    "polib>=1.2.0",
    "pypdf>=6.10.2",
    "pytest-cov>=7.1.0",
]
